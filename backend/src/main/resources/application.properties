# Application
spring.application.name=inventory-management
server.port=8080

# Local secrets (optional, recommended for dev)
# Create backend/openai.secrets.properties (git-ignored) to avoid re-setting env vars each run.
spring.config.import=optional:file:./openai.secrets.properties

# Java 21 - Virtual Threads (Project Loom)
spring.threads.virtual.enabled=true

# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/inventory_db
spring.data.mongodb.database=inventory_db

# Actuator (health endpoint used by Quick Start)
management.endpoints.web.exposure.include=health,info
management.health.mail.enabled=false

# Demo data (disable in production)
app.demo.seed-users=true

# JWT
jwt.secret=ThisIsAVeryLongSecretKeyForJWTTokenGenerationInInventoryManagementSystem2024
jwt.expiration=86400000

# Logging
logging.level.org.springframework.security=WARN
logging.level.com.inventory=DEBUG

# Disable Spring Security default password
spring.security.user.password=disabled

# Email (Gmail SMTP)
# NOTE: For Gmail you should use an App Password (not your normal account password).
# Set these environment variables before running:
#   GMAIL_USERNAME=youraddress@gmail.com
#   GMAIL_APP_PASSWORD=xxxx xxxx xxxx xxxx
app.email.enabled=true
app.email.from=${GMAIL_USERNAME:}
app.email.admin-recipients=${ALERT_RECIPIENTS:}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# OpenAI (GPT) Demand Prediction
# Set these environment variables:
#   OPENAI_ENABLED=true
#   OPENAI_API_KEY=sk-...
#   OPENAI_MODEL=gpt-4.1-mini
# Optional:
#   OPENAI_BASE_URL=https://api.openai.com/v1
openai.enabled=${OPENAI_ENABLED:false}
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4.1-mini}
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
openai.timeout-seconds=${OPENAI_TIMEOUT_SECONDS:20}
