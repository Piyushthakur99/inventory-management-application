<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="360" viewBox="0 0 1600 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050A1A"/>
      <stop offset="0.55" stop-color="#081A34"/>
      <stop offset="1" stop-color="#0E2A48"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="dots" width="56" height="56" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="1.2" fill="#E0F2FE" opacity="0.10"/>
    </pattern>
  </defs>

  <rect width="1600" height="360" fill="url(#bg)"/>
  <rect width="1600" height="360" fill="url(#dots)"/>

  <!-- Globe -->
  <g transform="translate(1180,180)" filter="url(#glow)">
    <circle r="140" fill="#0B2442" opacity="0.55"/>
    <circle r="140" fill="none" stroke="#93C5FD" stroke-opacity="0.25" stroke-width="2"/>

    <!-- Latitude lines -->
    <ellipse rx="130" ry="42" fill="none" stroke="#60A5FA" stroke-opacity="0.22" stroke-width="2"/>
    <ellipse rx="130" ry="78" fill="none" stroke="#A78BFA" stroke-opacity="0.18" stroke-width="2"/>
    <ellipse rx="130" ry="110" fill="none" stroke="#34D399" stroke-opacity="0.14" stroke-width="2"/>

    <!-- Longitude arcs -->
    <path d="M0 -140 C 54 -90, 54 90, 0 140" fill="none" stroke="#E0F2FE" stroke-opacity="0.20" stroke-width="2"/>
    <path d="M0 -140 C -54 -90, -54 90, 0 140" fill="none" stroke="#E0F2FE" stroke-opacity="0.20" stroke-width="2"/>
    <path d="M-70 -122 C -8 -74, -8 74, -70 122" fill="none" stroke="#93C5FD" stroke-opacity="0.14" stroke-width="2"/>
    <path d="M70 -122 C 8 -74, 8 74, 70 122" fill="none" stroke="#93C5FD" stroke-opacity="0.14" stroke-width="2"/>

    <!-- Network nodes -->
    <g fill="#E0F2FE" fill-opacity="0.75" stroke="none">
      <circle cx="-86" cy="-40" r="4"/>
      <circle cx="-30" cy="60" r="4"/>
      <circle cx="40" cy="-10" r="4"/>
      <circle cx="84" cy="58" r="4"/>
      <circle cx="10" cy="-88" r="4"/>
    </g>
    <g fill="none" stroke="#E0F2FE" stroke-opacity="0.22" stroke-width="2">
      <path d="M-86 -40 L-30 60 L40 -10 L84 58"/>
      <path d="M10 -88 L40 -10"/>
      <path d="M10 -88 L-86 -40"/>
    </g>
  </g>

  <!-- Left glow -->
  <circle cx="260" cy="110" r="220" fill="#60A5FA" fill-opacity="0.08" filter="url(#glow)"/>
</svg>
