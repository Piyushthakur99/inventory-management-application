<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071026"/>
      <stop offset="0.55" stop-color="#0A1E3F"/>
      <stop offset="1" stop-color="#132B4A"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="ticks" width="120" height="60" patternUnits="userSpaceOnUse">
      <path d="M0 60H120" stroke="#93C5FD" stroke-opacity="0.06" stroke-width="1"/>
      <path d="M0 30H120" stroke="#A78BFA" stroke-opacity="0.05" stroke-width="1"/>
      <path d="M60 0V60" stroke="#34D399" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="400" fill="url(#bg)"/>
  <rect width="1600" height="400" fill="url(#ticks)"/>

  <!-- Bars -->
  <g opacity="0.55" filter="url(#glow)">
    <rect x="140" y="250" width="48" height="110" rx="10" fill="#60A5FA"/>
    <rect x="210" y="210" width="48" height="150" rx="10" fill="#A78BFA"/>
    <rect x="280" y="160" width="48" height="200" rx="10" fill="#34D399"/>
    <rect x="350" y="190" width="48" height="170" rx="10" fill="#60A5FA"/>
    <rect x="420" y="130" width="48" height="230" rx="10" fill="#A78BFA"/>
  </g>

  <!-- Trend line + arrow -->
  <path d="M520 290 C 610 245, 680 260, 760 210 S 930 120, 1010 150 S 1180 210, 1300 120" fill="none" stroke="#E0F2FE" stroke-opacity="0.70" stroke-width="4" filter="url(#glow)"/>
  <path d="M1300 120 L1336 104 L1328 140 Z" fill="#E0F2FE" fill-opacity="0.70" filter="url(#glow)"/>

  <!-- Points -->
  <g fill="#E0F2FE" fill-opacity="0.80" filter="url(#glow)">
    <circle cx="520" cy="290" r="5"/>
    <circle cx="760" cy="210" r="5"/>
    <circle cx="1010" cy="150" r="5"/>
    <circle cx="1300" cy="120" r="5"/>
  </g>

  <!-- Soft highlight -->
  <circle cx="1220" cy="70" r="260" fill="#60A5FA" fill-opacity="0.08" filter="url(#glow)"/>
</svg>
