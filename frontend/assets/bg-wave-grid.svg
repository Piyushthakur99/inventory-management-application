<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B122A"/>
      <stop offset="0.55" stop-color="#0B1A3A"/>
      <stop offset="1" stop-color="#112847"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#93C5FD" stroke-opacity="0.055" stroke-width="1"/>
      <path d="M32 0V64M0 32H64" fill="none" stroke="#A78BFA" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <!-- Waves -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M-40 560 C 180 500, 320 640, 540 580 S 930 520, 1140 590 S 1460 700, 1700 610" stroke="#60A5FA" stroke-opacity="0.16" stroke-width="6"/>
    <path d="M-60 640 C 160 585, 320 760, 560 680 S 980 580, 1200 680 S 1500 820, 1700 720" stroke="#A78BFA" stroke-opacity="0.14" stroke-width="6"/>
    <path d="M-80 720 C 160 680, 360 860, 600 780 S 1020 660, 1240 760 S 1520 920, 1720 820" stroke="#34D399" stroke-opacity="0.10" stroke-width="6"/>
  </g>

  <!-- Subtle vignette -->
  <rect width="1600" height="900" fill="#000" opacity="0.18"/>
</svg>
