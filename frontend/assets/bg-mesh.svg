<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#a78bfa" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0.28"/>
    </linearGradient>

    <radialGradient id="r1" cx="30%" cy="20%" r="65%">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="r2" cx="78%" cy="28%" r="70%">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="r3" cx="70%" cy="90%" r="80%">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 H 0 V 48" fill="none" stroke="#0f172a" stroke-opacity="0.16" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.1" fill="#0f172a" fill-opacity="0.14"/>
      <circle cx="48" cy="0" r="1.1" fill="#0f172a" fill-opacity="0.14"/>
      <circle cx="0" cy="48" r="1.1" fill="#0f172a" fill-opacity="0.14"/>
      <circle cx="48" cy="48" r="1.1" fill="#0f172a" fill-opacity="0.14"/>
    </pattern>

    <filter id="softBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#g)" opacity="0.55"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity="0.9"/>

  <g filter="url(#softBlur)">
    <ellipse cx="460" cy="170" rx="520" ry="280" fill="url(#r1)"/>
    <ellipse cx="1240" cy="210" rx="580" ry="320" fill="url(#r2)"/>
    <ellipse cx="1120" cy="840" rx="720" ry="420" fill="url(#r3)"/>
  </g>
</svg>
